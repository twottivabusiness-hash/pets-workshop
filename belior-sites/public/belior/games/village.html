<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>토끼네 작은 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen cozy game. Thin header strip, full-bleed canvas stage, paper-tag HUD and a paper modal for bag / encyclopedia / shop. */
:root{
  --sky:#e2efe6; --ink:#3c4a40; --ink-soft:#6b7a6e; --leaf:#5a9a5c;
  --paper:#fffaf1; --paper-edge:#e8dcc4; --berry:#c8607f; --bell:#e8b23e; --mint:#7cc3a5;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{box-sizing:border-box;background:var(--sky);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:10px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1180px;width:100%;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 6px 0 0;text-wrap:balance}
.help{font-size:.8rem;color:var(--ink-soft);margin-right:auto;min-width:0}
.help kbd{font-family:var(--display);background:var(--paper);border:1px solid var(--paper-edge);border-bottom-width:2px;border-radius:6px;padding:0 5px;color:var(--ink)}
.btn{font-family:var(--display);font-size:.9rem;border:1px solid var(--paper-edge);border-bottom-width:3px;background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:active{transform:translateY(1px);border-bottom-width:2px}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.btn.hot{background:var(--berry);color:#fff;border-color:#a94e6a}

#stage{position:relative;flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;border-radius:22px;overflow:hidden;background:#5fb0d8;box-shadow:0 10px 30px rgba(60,90,60,.18),inset 0 0 0 4px rgba(255,255,255,.5);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;background:var(--paper);border:1px solid var(--paper-edge);border-bottom-width:3px;border-radius:14px;padding:6px 12px;font-family:var(--display);color:var(--ink)}
#bellTag{top:12px;left:12px;display:flex;align-items:center;gap:7px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4 0 18%,var(--bell) 20% 100%);box-shadow:inset 0 -2px 0 rgba(150,100,20,.35)}
#goalTag{top:56px;left:12px;font-size:.82rem;line-height:1.5;padding:7px 12px;max-width:min(240px,calc(100% - 140px))}
#goalTag .gt{font-size:.72rem;color:var(--berry);letter-spacing:.04em}
#goalTag .g{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
#goalTag .g.done{color:var(--leaf);text-decoration:line-through}
#clockTag{top:12px;right:12px;text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
#clockTag b{font-weight:400;font-size:1.15rem;display:block}
#clockTag span{font-size:.75rem;color:var(--ink-soft);font-family:var(--body)}
#dialog{left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;padding:16px 18px 14px;border-radius:20px;font-family:var(--body);font-size:1rem;line-height:1.55;cursor:pointer}
#dialog .who{position:absolute;top:-14px;left:18px;font-family:var(--display);background:var(--berry);color:#fff;padding:2px 12px;border-radius:999px;font-size:.95rem}
#dialog .next{position:absolute;right:14px;bottom:6px;font-size:.8rem;color:var(--berry);animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
#toast{top:12px;left:50%;transform:translateX(-50%);font-size:.95rem;padding:6px 14px;white-space:nowrap;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.off{opacity:0;transform:translate(-50%,-6px)}
#big{top:38%;left:50%;transform:translate(-50%,-50%) scale(1);text-align:center;font-size:clamp(1rem,4.4vw,1.25rem);padding:12px 22px;border-radius:20px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);box-sizing:border-box;transition:opacity .3s,transform .3s}
#big small{display:block;font-family:var(--body);font-size:.8rem;color:var(--ink-soft)}
#big.off{opacity:0;transform:translate(-50%,-50%) scale(.85)}

#modal{position:absolute;inset:0;background:rgba(48,66,52,.38);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.panel{background:var(--paper);border:1px solid var(--paper-edge);border-bottom-width:4px;border-radius:22px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px dashed var(--paper-edge)}
.mhead h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;margin-right:auto}
.mhead .sub{font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#mbody{overflow:auto;padding:12px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sec h3{font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--berry);margin:0 0 6px;letter-spacing:.03em}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(232,220,196,.6)}
.row img{width:40px;height:40px}
.row .nm{font-family:var(--display);font-size:1rem}
.row .meta{font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mini{font-family:var(--display);font-size:.85rem;border:0;border-radius:999px;padding:6px 12px;background:var(--mint);color:#fff;cursor:pointer;box-shadow:0 3px 0 #5a9d81;white-space:nowrap}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 #5a9d81}
.mini[disabled]{background:#cfd6cf;box-shadow:0 3px 0 #b5bdb5;cursor:default}
.mini.pink{background:var(--berry);box-shadow:0 3px 0 #9c4762}
.empty{font-size:.88rem;color:var(--ink-soft);padding:6px 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{background:#fff;border:1px solid var(--paper-edge);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell img{width:44px;height:44px}
.cell.no img{filter:brightness(0) opacity(.2)}
.cell b{font-family:var(--display);font-weight:400;font-size:.9rem}
.cell span{font-size:.68rem;color:var(--ink-soft);line-height:1.3}
.bar{height:8px;border-radius:99px;background:#efe6d3;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--leaf));border-radius:99px}

#pad{display:none}
@media (pointer:coarse){
  .help{display:none}
  #goalTag{top:54px;font-size:.74rem;padding:5px 10px}
  #toast{top:auto;bottom:150px}
  #dialog{bottom:150px}
  #pad{display:block}
}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,250,241,.45);border:2px solid rgba(255,255,255,.7)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:1px solid var(--paper-edge);border-bottom-width:3px}
#abtn{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;border:0;background:var(--berry);color:#fff;font-family:var(--display);font-size:1.5rem;box-shadow:0 5px 0 #9c4762}
#abtn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c4762}
#runbtn{position:absolute;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:.9rem;box-shadow:0 4px 0 var(--paper-edge)}
#runbtn.on{background:var(--bell);color:#fff;box-shadow:0 4px 0 #b58525}
@media (prefers-reduced-motion:reduce){#toast,#big{transition:none}#dialog .next{animation:none}}
</style>

<header>
  <h1>토끼네 작은 마을</h1>
  <div class="help"><kbd>←↑↓→</kbd> 걷기 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 행동 · <kbd>I</kbd> 가방 · <kbd>P</kbd> 도감</div>
  <button class="btn" id="bagBtn" type="button">가방</button>
  <button class="btn" id="dexBtn" type="button">도감</button>
  <button class="btn" id="timeBtn" type="button">시간: 지금</button>
  <button class="btn" id="soundBtn" type="button">소리 켜기</button>
</header>

<div id="stage">
  <canvas id="game" aria-label="토끼 캐릭터가 마을을 돌아다니는 게임 화면"></canvas>
  <div class="tag" id="bellTag"><span class="coin"></span><span id="bells">0</span>벨</div>
  <div class="tag" id="goalTag"></div>
  <div class="tag" id="clockTag"><b id="clock">--:--</b><span id="dayline">오늘의 마을</span></div>
  <div class="tag off" id="toast"></div>
  <div class="tag off" id="big"></div>
  <div class="tag" id="dialog" hidden><span class="who" id="who"></span><div id="say"></div><span class="next">▸</span></div>
  <div id="pad">
    <div id="joy"><div id="knob"></div></div>
    <button id="runbtn" type="button">달리기</button>
    <button id="abtn" type="button" aria-label="행동">A</button>
  </div>
  <div id="modal" hidden><div class="panel" role="dialog" aria-modal="true"><div class="mhead"><h2 id="mtitle"></h2><span class="sub" id="msub"></span><button class="btn" id="mclose" type="button">닫기</button></div><div id="mbody"></div></div></div>
</div>

<script>
(()=>{
const T=32, W=34, H=26;
const cv=document.getElementById('game'); const mainCtx=cv.getContext('2d'); let ctx=mainCtx;
const stage=document.getElementById('stage');
let seed=20261016; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
let timeMode=0; // declared first: world setup calls hourNow() before the time UI section
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00; return w+((c>=0&&c<=11171&&c%28)?a:b)};

/* ================= world ================= */
const map=[...Array(H)].map(()=>Array(W).fill(0)); // 0 grass 1 water 2 path 3 bridge
for(let y=0;y<H;y++){const cx=22+Math.round(Math.sin(y*0.33)*1.6);for(let d=-1;d<=1;d++)map[y][cx+d]=1;}
const POND={x:9,y:19};
for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(Math.hypot(x+.5-POND.x,y+.5-POND.y)<2.7) map[y][x]=1;
const SAND0=22, SEA0=24; // 4 = sand, sea rows are water
for(let y=SAND0;y<H;y++)for(let x=0;x<W;x++){ if(y>=SEA0) map[y][x]=1; else if(map[y][x]!==1) map[y][x]=4; }
const setPath=(x,y)=>{map[y][x]=map[y][x]===1?3:2};
for(let x=6;x<=27;x++)setPath(x,13);
for(let y=8;y<=13;y++)setPath(6,y);
for(let y=9;y<=13;y++)setPath(27,y);
for(let y=14;y<=15;y++)setPath(9,y);
const house={kind:'house',x:4.5*T,y:4*T,w:4*T,h:4*T}, shop={kind:'shop',x:25.5*T,y:5*T,w:4*T,h:4*T};
const buildings=[house,shop];
const solidRect=b=>({x:b.x+4,y:b.y+1.4*T,w:b.w-8,h:b.h-1.4*T});
const tileAt=(tx,ty)=>(tx<0||ty<0||tx>=W||ty>=H)?1:map[ty][tx];
const tileAtPx=(x,y)=>tileAt(Math.floor(x/T),Math.floor(y/T));
const inPond=(x,y)=>Math.hypot(x/T-POND.x,y/T-POND.y)<3.2;
const nearBuilding=(px,py,m)=>buildings.some(b=>px>b.x-m&&px<b.x+b.w+m&&py>b.y-m&&py<b.y+b.h+m);
function freeTile(tx,ty,needDry,r=Math.random){
  if(tx<2||ty<2||tx>W-3||ty>H-3)return false; if(map[ty][tx]!==0)return false;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const v=tileAt(tx+dx,ty+dy);if(v===2||v===3)return false;if(needDry&&v===1)return false;}
  return !nearBuilding(tx*T+16,ty*T+16,T*.9);
}
const trees=[];
for(let x=0;x<W;x++){if(map[0][x]!==1)trees.push({x:x*T+16,y:T-2,cedar:1});}
for(let y=1;y<SAND0;y++){trees.push({x:12,y:y*T+26,cedar:1});trees.push({x:W*T-12,y:y*T+26,cedar:1});}
const FRUITS=['peach','apple','orange']; let tries=0;
while(trees.filter(t=>!t.cedar).length<16&&tries++<3000){
  const tx=2+Math.floor(rnd()*(W-4)),ty=2+Math.floor(rnd()*(H-4)); if(!freeTile(tx,ty,true))continue;
  const x=tx*T+16,y=ty*T+26; if(trees.some(t=>!t.cedar&&Math.hypot(t.x-x,t.y-y)<T*2.6))continue;
  const i=trees.filter(t=>!t.cedar).length; trees.push({x,y,type:FRUITS[i%3],fruits:3,regrow:0,shake:0});
}
tries=0; let extra=0;
while(extra<6&&tries++<2000){const tx=2+Math.floor(rnd()*(W-4)),ty=2+Math.floor(rnd()*(H-4)); if(!freeTile(tx,ty,true))continue; const x=tx*T+16,y=ty*T+26; if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<T*2))continue; trees.push({x,y,cedar:2}); extra++;}
const flowers=[]; const FCOL=['#f7c6d4','#fff3a6','#cfe0ff','#ffffff','#f6b6a2']; tries=0;
while(flowers.length<60&&tries++<4000){const tx=Math.floor(rnd()*W),ty=Math.floor(rnd()*H); if(!freeTile(tx,ty,false))continue; const x=tx*T+6+rnd()*20,y=ty*T+8+rnd()*18; if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<24))continue; flowers.push({x,y,c:FCOL[Math.floor(rnd()*FCOL.length)]});}
const lamps=[[10,12],[16,12],[24,12],[5,10]].filter(([x,y])=>map[y][x]===0).map(([x,y])=>({x:x*T+16,y:y*T+28}));

/* ================= data ================= */
const ITEMS={
  peach:{n:'복숭아',p:120,c:'fruit'},apple:{n:'사과',p:100,c:'fruit'},orange:{n:'오렌지',p:100,c:'fruit'},
  weed:{n:'잡초',p:10,c:'misc'},
  white:{n:'흰나비',p:80,c:'bug',w:'꽃밭 · 낮'},yellow:{n:'노랑나비',p:110,c:'bug',w:'꽃밭 · 낮'},sky:{n:'하늘나비',p:650,c:'bug',w:'꽃밭 · 드물게'},moth:{n:'달빛나방',p:480,c:'bug',w:'가로등 · 밤'},
  piramy:{n:'피라미',p:100,c:'fish',w:'강 · 작은 그림자'},crucian:{n:'붕어',p:160,c:'fish',w:'강·연못'},goldfish:{n:'금붕어',p:1300,c:'fish',w:'연못 · 작은 그림자'},mandarin:{n:'쏘가리',p:1000,c:'fish',w:'강 · 중간 그림자'},
  carp:{n:'잉어',p:300,c:'fish',w:'큰 그림자'},catfish:{n:'메기',p:800,c:'fish',w:'밤 · 큰 그림자'},trout:{n:'무지개송어',p:2400,c:'fish',w:'강 · 큰 그림자 · 드물게'},goldcarp:{n:'황금잉어',p:6000,c:'fish',w:'아주 아주 드물게'},
  ammonite:{n:'암모나이트',p:700,c:'fossil',w:'땅 속'},trilobite:{n:'삼엽충',p:900,c:'fossil',w:'땅 속'},tooth:{n:'공룡 이빨',p:1500,c:'fossil',w:'땅 속 · 드물게'},
  horse:{n:'전갱이',p:150,c:'fish',w:'바다 · 작은 그림자'},seabass:{n:'농어',p:400,c:'fish',w:'바다 · 중간 그림자'},seabream:{n:'도미',p:2800,c:'fish',w:'바다 · 큰 그림자 · 드물게'},
  clam:{n:'바지락',p:60,c:'shell',w:'해변'},conch:{n:'소라',p:150,c:'shell',w:'해변'},scallop:{n:'가리비',p:300,c:'shell',w:'해변'},coral:{n:'산호 조각',p:700,c:'shell',w:'해변 · 드물게'},
};
const FL_SP={tulip:'튤립',cosmos:'코스모스'};
const FL_COL={red:['빨강','#e2574c'],yellow:['노랑','#f6c945'],white:['하양','#ffffff'],orange:['주황','#f39243'],pink:['분홍','#f39fb4'],purple:['보라','#9a7bd0']};
for(const sp in FL_SP)for(const c in FL_COL){ITEMS[sp+'_'+c]={n:`${FL_COL[c][0]} ${FL_SP[sp]}`,p:c==='purple'?1200:(c==='orange'||c==='pink')?280:80,c:'flower',sp,col:c,
  w:c==='purple'?'분홍끼리 · 주황+분홍 · 드물게':c==='orange'?'빨강+노랑 나란히':c==='pink'?'빨강+하양 나란히':'잡화점 씨앗'};}
const BASE_SEEDS=['tulip_red','tulip_yellow','tulip_white','cosmos_red','cosmos_yellow','cosmos_white'];
const DEX=['piramy','crucian','goldfish','mandarin','carp','catfish','trout','goldcarp','horse','seabass','seabream','white','yellow','sky','moth','clam','conch','scallop','coral','ammonite','trilobite','tooth',...Object.keys(ITEMS).filter(k=>ITEMS[k].c==='flower')];
const GROW_MS=15000;
const HATS={bow:{n:'분홍 리본',p:0},straw:{n:'밀짚모자',p:800},flower:{n:'꽃화관',p:1200},beret:{n:'베레모',p:2000},crown:{n:'작은 왕관',p:8000}};
const DECOR={pot:{n:'꽃 화분',p:400,r:8},lantern:{n:'정원 등불',p:900,r:8},bench:{n:'나무 벤치',p:1500,r:14},statue:{n:'토끼 동상',p:3000,r:11}};
const FCOLOR={peach:'#f6a08c',apple:'#e2574c',orange:'#f3a33a'};
const BUGS={yellow:['#ffd84d','#ffef9c'],white:['#ffffff','#e9eef5'],sky:['#7cc4f0','#c7e8fb'],moth:['#a796dc','#e0d8f6']};
const FISHC={piramy:['#b7cfdc','#8fb0c2'],crucian:['#c2ad80','#9c8558'],goldfish:['#f39243','#fff1d6'],mandarin:['#d1ad57','#6b5a2e'],carp:['#98a07c','#6f7656'],catfish:['#76757b','#4d4c52'],trout:['#a9bfd1','#ef8fa6'],goldcarp:['#f4cc4f','#fff3b0'],horse:['#a8b8c6','#6f8396'],seabass:['#9aa7ad','#5d6b72'],seabream:['#f0a3a0','#d9706f']};
const GOALS={shell:['조개 줍기',3],garden:['꽃 피우기',1],fish:['물고기 낚기',3],bug:['곤충 잡기',2],fruit:['과일 줍기',6],dig:['땅 파기',2],req:['이웃 부탁 들어주기',1],weed:['잡초 뽑기',3],sell:['팔아서 벨 벌기',1500],balloon:['선물 풍선 잡기',1]};

const DEF=()=>({bells:500,inv:{},talks:{},hearts:{},dex:{},hats:['bow'],hat:'bow',decorInv:{},decor:[],goals:null,round:0,giftHat:{},seeds:{tulip_red:2,tulip_yellow:2,cosmos_white:1},garden:[]});
let save=DEF();

function randFreePoint(minDist=0){for(let k=0;k<60;k++){const tx=Math.floor(Math.random()*W),ty=Math.floor(Math.random()*H); if(!freeTile(tx,ty,false))continue; const x=tx*T+16,y=ty*T+20; if(Math.hypot(x-player.x,y-player.y)<minDist)continue; if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<32)||weeds.some(w=>Math.hypot(w.x-x,w.y-y)<28)||digs.some(w=>Math.hypot(w.x-x,w.y-y)<28)||save.decor.some(d=>Math.hypot(d.x-x,d.y-y)<30))continue; return {x,y};}return null;}

function spawnShadow(near){
  for(let k=0;k<80;k++){let x,y;
    if(near){const a=Math.random()*Math.PI*2,r=R(50,90); x=near.x+Math.cos(a)*r; y=near.y+Math.sin(a)*r;}
    else{x=R(T,W*T-T); y=R(T,H*T-T);}
    if(x<T||x>W*T-T||y<T||y>H*T-10)continue;
    if(tileAtPx(x,y)!==1||tileAtPx(x+8,y)!==1||tileAtPx(x-8,y)!==1)continue;
    if(near&&!waterLine(x,y,near.x,near.y))continue;
    if(!near&&Math.hypot(x-player.x,y-player.y)<90)continue;
    const r=Math.random(); const s={x,y,size:r<.45?'s':r<.8?'m':'l',pond:inPond(x,y),sea:y/T>=SEA0,tx:x,ty:y,t:Math.random()*9,flee:0};
    shadows.push(s); return s;}
  return null;
}

/* ================= audio ================= */
let ac=null,soundOn=false;
function tone(f,d=.09,type='sine',v=.07,slide=1.5){if(!soundOn||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*slide,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.06);}
const SFX={
  chime:()=>{tone(660);setTimeout(()=>tone(880),80);setTimeout(()=>tone(1180,.14),160)},
  fanfare:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.13,'triangle',.08,1.01),i*110));setTimeout(()=>tone(1318,.3,'triangle',.07,1.01),470)},
  plop:()=>tone(420,.06,'sine',.06,.6), splash:()=>{tone(240,.12,'triangle',.07,.5);tone(900,.05,'sine',.03,.4)},
  pick:()=>tone(780,.06), rustle:()=>tone(220,.12,'triangle',.05,1.2), dig:()=>tone(160,.08,'square',.03,.7),
  no:()=>tone(300,.06,'triangle',.03,.8), coin:()=>{tone(988,.05,'square',.03,1);setTimeout(()=>tone(1319,.12,'square',.03,1),60)}
};
document.getElementById('soundBtn').onclick=e=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();soundOn=!soundOn}catch(err){soundOn=false}e.currentTarget.textContent=soundOn?'소리 끄기':'소리 켜기';if(soundOn)SFX.chime();};

/* ================= time ================= */
const MODES=['지금','낮','저녁','밤'];
document.getElementById('timeBtn').onclick=e=>{timeMode=(timeMode+1)%4;e.currentTarget.textContent='시간: '+MODES[timeMode];tickClock();};
function hourNow(){if(timeMode===1)return 13;if(timeMode===2)return 18.3;if(timeMode===3)return 22;const d=new Date();return d.getHours()+d.getMinutes()/60;}
function darkness(h){if(h>=20||h<5)return .5;if(h>=17)return(h-17)/3*.5;if(h<7)return(7-h)/2*.5;return 0;}

/* ================= drawing primitives ================= */
const ell=(x,y,rx,ry,c,rot=0)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fill();};
const circ=(x,y,r,c,stroke)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();}};
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function heart(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.6,y-s*1.3,x,y-s*.4);ctx.bezierCurveTo(x+s*.6,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);ctx.fill();}
function drawFlowerAt(x,y,c,s=2){for(let i=0;i<5;i++){const a=i*Math.PI*2/5+x;circ(x+Math.cos(a)*s*1.2,y+Math.sin(a)*s*1.2,s,c);}circ(x,y,s*.7,'#f2c14e');}
function drawWings(k,x,y,flap=1){const c=BUGS[k];for(const s of[-1,1]){ctx.fillStyle=c[0];ctx.beginPath();ctx.ellipse(x+s*4*flap,y-2,5*flap+.6,4.2,s*.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(60,60,80,.35)';ctx.lineWidth=.8;ctx.stroke();ctx.fillStyle=c[1];ctx.beginPath();ctx.ellipse(x+s*3*flap,y+3,3.4*flap+.5,3,-s*.3,0,Math.PI*2);ctx.fill();}
  if(k==='moth'){circ(x-3*flap,y-2,1,'#5e4f94');circ(x+3*flap,y-2,1,'#5e4f94');} ctx.fillStyle='#3a3340';ctx.fillRect(x-.8,y-5,1.6,10);}
function drawFish(k){const [a,b]=FISHC[k];const L=(k==='goldfish'||k==='piramy')?.8:(k==='carp'||k==='catfish'||k==='goldcarp'||k==='trout')?1.15:1;ctx.scale(L,L);
  ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(16,-7);ctx.lineTo(14,0);ctx.lineTo(16,7);ctx.closePath();ctx.fill();
  ell(-1,0,11,6,a); if(k==='goldfish')ell(-1,2.2,7,2.6,b);
  if(k==='trout'){ctx.fillStyle=b;ctx.fillRect(-9,-1,16,2.4);}
  if(k==='mandarin')for(const[px,py]of[[-3,-2],[2,1],[-1,3],[4,-2]])circ(px,py,1.2,b);
  ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(-3,-5);ctx.lineTo(4,-10);ctx.lineTo(5,-4);ctx.fill();
  circ(-7,-1.5,1.7,'#2f2a33');circ(-7.4,-2.1,.55,'#fff');
  if(k==='catfish'){ctx.strokeStyle=b;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-11,1);ctx.quadraticCurveTo(-15,3,-16,6);ctx.moveTo(-11,0);ctx.quadraticCurveTo(-15,-1,-17,1);ctx.stroke();}
  if(k==='goldcarp'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3,-3);ctx.lineTo(1,-3);ctx.moveTo(-1,-5);ctx.lineTo(-1,-1);ctx.stroke();}}
function drawHat(k,x,y){
  if(k==='straw'){ell(x,y+1,17,4.5,'#e7c46c');ell(x,y-3,9.5,6.5,'#efd283');ctx.fillStyle='#d9625b';ctx.fillRect(x-9.5,y-1.5,19,2.6);}
  else if(k==='flower'){ctx.strokeStyle='#6aa557';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+10,13,Math.PI*1.15,Math.PI*1.85);ctx.stroke();[['#f7c6d4',-11,2],['#fff3a6',-6,-2],['#f6b6a2',0,-3],['#cfe0ff',6,-2],['#f7c6d4',11,2]].forEach(([c,dx,dy])=>drawFlowerAt(x+dx,y+dy,c,1.9));}
  else if(k==='beret'){ell(x-2,y-1,13,5.5,'#c8607f',-.15);circ(x-3,y-7,1.8,'#a44b67');}
  else if(k==='crown'){ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.moveTo(x-9,y+2);ctx.lineTo(x-9,y-6);ctx.lineTo(x-4.5,y-1.5);ctx.lineTo(x,y-9);ctx.lineTo(x+4.5,y-1.5);ctx.lineTo(x+9,y-6);ctx.lineTo(x+9,y+2);ctx.closePath();ctx.fill();ctx.strokeStyle='#c99b2a';ctx.lineWidth=1;ctx.stroke();circ(x,y-1,1.8,'#c8607f');circ(x-6,y,1.3,'#7cc4f0');circ(x+6,y,1.3,'#7cc4f0');}
  else if(k==='bow'){ctx.fillStyle='#f08aa6';ctx.beginPath();ctx.ellipse(x-4,y,5,3.2,.3,0,Math.PI*2);ctx.ellipse(x+4,y,5,3.2,-.3,0,Math.PI*2);ctx.fill();circ(x,y,2.2,'#d86f8c');}
}
function drawDecor(k,x,y,night){
  if(k==='pot'){ell(x,y,9,3,'rgba(40,70,40,.22)');ctx.fillStyle='#d58a62';ctx.beginPath();ctx.moveTo(x-8,y-12);ctx.lineTo(x+8,y-12);ctx.lineTo(x+6,y);ctx.lineTo(x-6,y);ctx.closePath();ctx.fill();ctx.fillStyle='#c27654';ctx.fillRect(x-9,y-14,18,4);ell(x,y-16,7,3,'#5f9e5a');drawFlowerAt(x-4,y-19,'#f7c6d4',2);drawFlowerAt(x+4,y-20,'#fff3a6',2);drawFlowerAt(x,y-24,'#f6b6a2',2);}
  else if(k==='lantern'){ell(x,y,9,3,'rgba(40,70,40,.22)');ctx.fillStyle='#b9b6ae';ctx.fillRect(x-6,y-10,12,10);ctx.fillRect(x-3,y-16,6,6);ctx.fillStyle=night?'#ffe7a3':'#f4ead0';ctx.fillRect(x-6,y-26,12,10);ctx.strokeStyle='#8f8b83';ctx.lineWidth=1.5;ctx.strokeRect(x-6,y-26,12,10);ctx.fillStyle='#8f8b83';ctx.beginPath();ctx.moveTo(x-10,y-26);ctx.lineTo(x+10,y-26);ctx.lineTo(x,y-34);ctx.closePath();ctx.fill();}
  else if(k==='bench'){ell(x,y,18,4,'rgba(40,70,40,.22)');ctx.fillStyle='#8f6440';ctx.fillRect(x-15,y-8,3,8);ctx.fillRect(x+12,y-8,3,8);ctx.fillStyle='#c08a5a';ctx.fillRect(x-17,y-11,34,4);ctx.fillRect(x-17,y-20,34,3.5);ctx.fillRect(x-17,y-15,34,3);ctx.fillStyle='#8f6440';ctx.fillRect(x-15,y-21,3,10);ctx.fillRect(x+12,y-21,3,10);}
  else if(k==='statue'){ell(x,y,12,4,'rgba(40,70,40,.22)');ctx.fillStyle='#b5b8b4';ctx.fillRect(x-10,y-8,20,8);ell(x,y-15,8,7,'#d2d5d1');circ(x,y-27,7,'#d2d5d1');ell(x-3,y-39,2.6,7,'#d2d5d1',-.15);ell(x+3,y-39,2.6,7,'#d2d5d1',.15);circ(x-2.5,y-27,.9,'#8e918d');circ(x+2.5,y-27,.9,'#8e918d');}
}
function drawBloom(sp,col,x,y,s=1){const c=FL_COL[col][1];
  if(sp==='tulip'){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-5*s,y-6*s);ctx.lineTo(x-5*s,y);ctx.quadraticCurveTo(x,y+4.5*s,x+5*s,y);ctx.lineTo(x+5*s,y-6*s);ctx.lineTo(x+2.5*s,y-3*s);ctx.lineTo(x,y-7.5*s);ctx.lineTo(x-2.5*s,y-3*s);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(90,60,70,.3)';ctx.lineWidth=.8;ctx.stroke();}
  else{for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*4.2*s,y+Math.sin(a)*4.2*s,3.3*s,1.7*s,a,0,Math.PI*2);ctx.fill();if(col==='white'){ctx.strokeStyle='rgba(120,110,130,.35)';ctx.lineWidth=.6;ctx.stroke();}}circ(x,y,2.1*s,'#f2c14e');}}
function drawPlant(p){const it=ITEMS[p.k],x=p.x,y=p.y,st=p.stage;
  ell(x,y,7.5,3,p.wetAt?'#6b4f37':'#a8865e');
  if(st===0){circ(x-1.5,y-1,1.6,'#7a5a3c');circ(x+2,y-.5,1.4,'#7a5a3c');}
  else{const h=st===1?6:st===2?12:16;ctx.strokeStyle='#5f9e5a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.stroke();
    ell(x-4,y-Math.min(5,h*.45),4.2,2,'#6db76a',-.6);ell(x+4,y-Math.min(6,h*.5),4.2,2,'#6db76a',.6);
    if(st===2){ell(x,y-h-2,2.8,4.2,FL_COL[it.col][1]);ctx.strokeStyle='rgba(90,60,70,.3)';ctx.lineWidth=.6;ctx.stroke();ell(x,y-h+1,2.6,1.6,'#5f9e5a');}
    if(st===3)drawBloom(it.sp,it.col,x,y-h-(it.sp==='tulip'?0:2));}
  if(p.wetAt&&st===3){const tw=(Math.sin(time*4+x)+1)/2;circ(x+7,y-20,1.4,`rgba(255,255,255,${.4+tw*.5})`);circ(x-6,y-24,1,`rgba(255,255,255,${.9-tw*.5})`);}
  if(p.wetAt&&st<3){circ(x+6,y-3,1.5,'rgba(191,230,247,.9)');}}
function drawItem(k,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const it=ITEMS[k];
  if(it&&it.c==='flower'){ctx.strokeStyle='#5f9e5a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-1);ctx.stroke();ell(-3.5,5,3.6,1.8,'#6db76a',-.6);drawBloom(it.sp,it.col,0,-3,1.25);ctx.restore();return;}
  if(k==='clam'){ctx.fillStyle='#ead7c0';ctx.beginPath();ctx.moveTo(-8,3);ctx.quadraticCurveTo(0,-12,8,3);ctx.quadraticCurveTo(0,7,-8,3);ctx.fill();ctx.strokeStyle='#bfa585';ctx.lineWidth=1;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*3,-4+Math.abs(i));ctx.lineTo(i*1.3,5);ctx.stroke();}ctx.restore();return;}
  if(k==='scallop'){ctx.fillStyle='#f3a58a';ctx.beginPath();ctx.moveTo(0,7);ctx.arc(0,7,12,Math.PI*1.18,Math.PI*1.82);ctx.closePath();ctx.fill();ctx.strokeStyle='#d9806a';ctx.lineWidth=1;for(let a=1.25;a<1.8;a+=.11){ctx.beginPath();ctx.moveTo(0,7);ctx.lineTo(Math.cos(a*Math.PI)*11,7+Math.sin(a*Math.PI)*11);ctx.stroke();}ctx.fillStyle='#e8957b';ctx.fillRect(-4,5,8,4);ctx.restore();return;}
  if(k==='conch'){ctx.fillStyle='#f0c9a8';ctx.beginPath();ctx.moveTo(-9,4);ctx.quadraticCurveTo(-3,-11,9,-6);ctx.quadraticCurveTo(4,2,7,8);ctx.quadraticCurveTo(-2,9,-9,4);ctx.fill();ctx.strokeStyle='#c99d78';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-5,-1);ctx.quadraticCurveTo(1,-6,7,-4);ctx.moveTo(-6,3);ctx.quadraticCurveTo(0,-2,6,0);ctx.stroke();ell(3,3,2.6,3.6,'#f5a9a6');ctx.restore();return;}
  if(k==='coral'){ctx.strokeStyle='#f07c8a';ctx.lineCap='round';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(0,-1);ctx.lineTo(-5,-8);ctx.moveTo(0,2);ctx.lineTo(5,-5);ctx.lineTo(7,-10);ctx.moveTo(5,-5);ctx.lineTo(2,-10);ctx.moveTo(0,-1);ctx.lineTo(-1,-10);ctx.stroke();ctx.restore();return;}
  if(FCOLOR[k]){circ(0,1,8,FCOLOR[k]);circ(-2.6,-1.6,2.4,'rgba(255,255,255,.6)');ell(3,-7,4,2,'#5a8f3e',-.5);if(k==='peach'){ctx.strokeStyle='rgba(200,90,80,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-6);ctx.quadraticCurveTo(3,1,0,8);ctx.stroke();}}
  else if(k==='weed'){ctx.strokeStyle='#4f8a3f';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();for(const[a,b]of[[-7,-10],[0,-13],[7,-9],[-3,-8],[3,-11]]){ctx.moveTo(a*.3,7);ctx.quadraticCurveTo(a*.6,7+b*.5,a,7+b);}ctx.stroke();}
  else if(it&&it.c==='bug')drawWings(k,0,0,1.25);

/* ================= collision ================= */
function blocked(px,py,r=9,ignore){
  if(px<T*.9||px>W*T-T*.9||py<T*1.3||py>H*T-T*.5)return true;
  for(const[ox,oy]of[[-r,-r*.5],[r,-r*.5],[-r,r*.5],[r,r*.5],[0,0]])if(tileAt(Math.floor((px+ox)/T),Math.floor((py+oy)/T))===1)return true;
  for(const t of trees)if(Math.abs(t.x-px)<40&&Math.abs(t.y-py)<40&&Math.hypot(t.x-px,(t.y-py)*1.3)<r+9)return true;
  for(const l of lamps)if(Math.hypot(l.x-px,l.y-py)<r+5)return true;
  for(const d of save.decor)if(d!==ignore&&Math.hypot(d.x-px,(d.y-py)*1.4)<r+DECOR[d.t].r)return true;
  for(const b of buildings){const s=solidRect(b);const cx=Math.max(s.x,Math.min(px,s.x+s.w)),cy=Math.max(s.y,Math.min(py,s.y+s.h));if(Math.hypot(px-cx,py-cy)<r)return true;}
  return false;
}
const DIRV={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};

  if(pair==='red|yellow')return'orange'; if(pair==='red|white')return'pink';

function findTarget(){

  let best=null,bd=1e9;const c=(o,d,max,kind,label)=>{if(d<max&&d<bd){bd=d;best={o,kind,label}}};
  for(const v of villagers)c(v,Math.hypot(v.x-fx,v.y-fy),36,'talk','말걸기');
  for(const b of butterflies)c(b,Math.hypot(b.x-fx,b.y+18-fy),34,'bug','잡기');
  if(balloon&&balloon.y>0)c(balloon,Math.hypot(balloon.x-fx,balloon.y-fy),46,'balloon','풍선 잡기');
  for(const w of weeds)c(w,Math.hypot(w.x-fx,w.y-fy),26,'weed','뽑기');

function talk(v){

      if(hs===2){const d=pick(['pot','lantern','bench']);save.decorInv[d]=(save.decorInv[d]||0)+1;lines.push(`우리 이제 꽤 친하지? 집에 있던 ${josa(DECOR[d].n,'을','를')} 줄게. 마을에 놓아 줘.`);}
      if(hs===4&&!save.giftHat[v.name]){const pool=Object.keys(HATS).filter(x=>!save.hats.includes(x)&&x!=='crown');save.giftHat[v.name]=1;if(pool.length){const g=pick(pool);save.hats.push(g);lines.push(`너한테 잘 어울릴 것 같아서… ${josa(HATS[g].n,'을','를')} 선물할게!`);}}

    } else lines.push(`부탁이 하나 있는데… ${nm} ${n}개만 구해다 줄 수 있어?${inv(k)?` (지금 ${inv(k)}개 있어요)`:''}`);
  } else lines.push(v.lines[(save.talks[v.name]-1)%v.lines.length]);
  renderHUD();persist();say(v.name,lines);

function pickFish(size,pond,sea){
  const n=isNight();let pool;
  if(sea)pool=size==='s'?[['horse',8]]:size==='m'?[['horse',3],['seabass',5]]:[['seabass',4],['seabream',1.4]];
  else if(size==='s')pool=pond?[['goldfish',2],['crucian',5],['piramy',3]]:[['piramy',7],['crucian',3]];
  else if(size==='m')pool=pond?[['crucian',6],['carp',3]]:[['crucian',4],['mandarin',3],['piramy',2]];
  else pool=pond?[['carp',6],['catfish',n?4:0],['goldcarp',.25]]:[['carp',4],['trout',1.4],['catfish',n?4:0],['goldcarp',.3]];
  const tot=pool.reduce((s,p)=>s+p[1],0);let r=Math.random()*tot;for(const[k,w]of pool){if((r-=w)<0)return k;}return pool[0][0];
}
function waterLine(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(y>H*T-4||tileAtPx(x,y)!==1)return false;}return true;}

  if(f.state==='bite'){f.dip=2;f.t-=dt*2;if(f.t<=0){toast('놓쳤어요… 쑥 들어가면 바로 당겨요!');f.fish.flee=3;f.fish.lure=false;fishing=null;SFX.no();}}

  for(const t of trees){if(t.shake>0)t.shake-=dt;if(!t.cedar&&t.fruits===0){t.regrow-=dt;if(t.regrow<=0)t.fruits=3;}}
  for(let i=holes.length-1;i>=0;i--){holes[i].life-=dt;if(holes[i].life<=0)holes.splice(i,1);}
  if((weedT-=dt)<=0){weedT=18;if(weeds.length<12)spawnWeed();}

    if(b.flee>0){b.flee-=dt;const a=Math.atan2(b.y-player.y,b.x-player.x);b.x+=Math.cos(a)*120*dt;b.y+=Math.sin(a)*120*dt-30*dt;}
    else{if(Math.hypot(b.tx-b.x,b.ty-b.y)<6){const hx=b.home?b.home.x:b.x,hy=b.home?b.home.y-40:b.y;b.tx=hx+R(-60,60)*(b.home?.6:1);b.ty=hy+R(-45,45)*(b.home?.5:1);}
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);b.x+=Math.cos(a)*28*dt;b.y+=Math.sin(a)*28*dt+Math.sin(b.t*3)*10*dt;}
    b.x=Math.max(T,Math.min(W*T-T,b.x));b.y=Math.max(T,Math.min(H*T-T*1.5,b.y));}
  for(let i=butterflies.length-1;i>=0;i--){const b=butterflies[i];if(b.flee>0&&Math.hypot(player.x-b.x,player.y-b.y)>420)butterflies.splice(i,1);}

function draw(){

  for(const w of weeds)if(inView(w.x,w.y))drawItem('weed',w.x,w.y-6,.9);
  for(const s of shells)if(inView(s.x,s.y)){ell(s.x,s.y+3,5,1.8,'rgba(120,100,60,.18)');drawItem(s.k,s.x,s.y,.55);}
  const h=hourNow(),dk=darkness(h),night=dk>.2;const list=[];
  for(const t of trees)if(inView(t.x,t.y))list.push([t.y,()=>drawTree(t)]);
  for(const l of lamps)if(inView(l.x,l.y))list.push([l.y,()=>drawLamp(l)]);
  for(const d of save.decor)if(inView(d.x,d.y))list.push([d.y,()=>drawDecor(d.t,d.x,d.y,night)]);
  for(const p of save.garden)if(inView(p.x,p.y))list.push([p.y,()=>drawPlant(p)]);
  for(const d of drops)list.push([d.y,()=>{if(d.delay>0)return;ell(d.x,d.y,5,2,'rgba(40,70,40,.25)');drawItem(d.type,d.x,d.y-6-d.z,.6);}]);
  list.push([house.y+house.h,()=>drawHouse(house,night)]);list.push([shop.y+shop.h,()=>drawShop(shop,night)]);
  for(const v of villagers){const near=Math.hypot(v.x-player.x,v.y-player.y)<80;const hs=save.hearts[v.name]||0;
    list.push([v.y,()=>drawCritter(v.x,v.y,v.kind,v.col,v.dir,v.t,v.moving,{label:near?(v.name+(hs?` ♥${hs}`:'')):null,req:v.req&&!v.talking?v.req[0]:null,reqReady:v.req&&inv(v.req[0])>=v.req[1]})]);}
  list.push([player.y,()=>drawCritter(player.x,player.y,'bunny','#fff',player.dir,player.t,player.moving,{hat:save.hat,hold:player.hold&&player.hold.k,dig:player.dig>0?player.dig:0,fishing:!!fishing})]);
  list.sort((a,b)=>a[0]-b[0]);for(const[,f]of list)f();
  if(fishing)drawBobber(fishing);
  for(const b of butterflies)if(inView(b.x,b.y)){const flap=Math.abs(Math.sin(b.t*(b.flee>0?26:b.kind==='moth'?22:16)));ell(b.x,b.y+22,4,1.6,'rgba(40,70,40,.18)');drawWings(b.kind,b.x,b.y+Math.sin(b.t*4)*3,flap);}
  if(balloon)drawBalloon(balloon);
  drawParts();
  if(!dialogOpen&&!fishing&&!player.hold&&!modalOpen){const tg=findTarget();if(tg)drawHint(tg);}
  if(dk>0){ctx.fillStyle=`rgba(30,36,92,${dk})`;ctx.fillRect(camX,camY,viewW,viewH);
    if(h>=16.5&&h<19.5){ctx.fillStyle=`rgba(255,140,80,${.13*(1-Math.abs(h-18)/1.5)})`;ctx.fillRect(camX,camY,viewW,viewH);}
    if(night){ctx.globalCompositeOperation='lighter';const k=Math.min(1,(dk-.2)/.3);
      const glow=(x,y,r,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,200,120,${a*k})`);g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);};
      for(const l of lamps)glow(l.x,l.y-26,80,.32);for(const d of save.decor)if(d.t==='lantern')glow(d.x,d.y-20,60,.3);
      glow(house.x+27,house.y+2.05*T+10,46,.3);glow(shop.x+shop.w/2,shop.y+1.9*T+11,60,.3);ctx.globalCompositeOperation='source-over';}}
  if(dk>.3)for(let i=0;i<16;i++){const fx=hash(i,7)%(W*T),fy=hash(i,13)%(H*T);const tw=(Math.sin(time*2+i)+1)/2;if(inView(fx,fy))circ(fx+Math.sin(time*.7+i)*10,fy+Math.cos(time*.5+i)*8,1.6,`rgba(240,255,170,${.5*tw})`);}
}

function tickClock(){const d=new Date();let hh,mm;if(timeMode===0){hh=d.getHours();mm=d.getMinutes();}else{const h=hourNow();hh=Math.floor(h);mm=Math.round((h-hh)*60);}
  $('clock').textContent=`${hh<12?'오전':'오후'} ${((hh+11)%12)+1}:${String(mm).padStart(2,'0')}`;const days=['일','월','화','수','목','금','토'];$('dayline').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;update(dt);draw();requestAnimationFrame(frame);}
function start(){renderHUD();tickClock();setInterval(tickClock,10000);requestAnimationFrame(frame);
  setTimeout(()=>{if(!save.talks.intro){save.talks.intro=1;save.talks.beach=1;persist();say('마루',['어서 와, 토끼야! 여긴 작은 마을이야.','물가를 보고 A를 누르면 낚시! 찌가 쑥 들어갈 때 다시 눌러.','가방에 꽃씨가 있어. 풀밭을 보고 심은 다음 물을 주면 자라!','남쪽 바닷가에선 조개를 주울 수 있어. 왼쪽 위 오늘의 목표도 채워 봐!']);}
    else if(!save.talks.beach){save.talks.beach=1;persist();say('마루',['마을 남쪽에 바닷가가 생겼다냥! 조개 주우러 가 봐.','그리고 가방에 꽃씨를 넣어 뒀어. 풀밭에 심고 물을 줘 봐냥.']);}
    else toast('오늘도 산책해 볼까요?');},500);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
})();
</script>
